services:
  - type: web
    name: stockanalyzer-ml
    branch: main
    autoDeployTrigger: commit
    runtime: docker
    plan: starter
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    healthCheckPath: /health
    envVars:
      - key: PYTHON_ENV
        value: production
      - key: MODEL_DIR
        value: /var/data/models
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: stockanalyzer-models
      mountPath: /var/data/models
      sizeGB: 5

  - type: web
    name: stockanalyzer-api
    branch: main
    autoDeployTrigger: commit
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://frontend-shiv-sharma-stockanalyzer.vercel.app,https://frontend-five-khaki-72.vercel.app
      - key: FRONTEND_URL
        value: https://frontend-shiv-sharma-stockanalyzer.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: stockanalyzer-ml
          property: hostport
