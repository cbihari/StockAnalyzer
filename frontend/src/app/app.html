<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/">
      <span class="brand-mark">S</span>
      <span><strong>Stock</strong>Analyzer</span>
    </a>
    <nav aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/search" routerLinkActive="active"><span>⌕</span> Research</a>
      <a routerLink="/market" routerLinkActive="active"><span>▥</span> Market</a>
      <a routerLink="/compare" routerLinkActive="active"><span>⇄</span> Compare</a>
      <a routerLink="/assistant" routerLinkActive="active"><span>✦</span> AI Assistant</a>
      <a routerLink="/watchlist" routerLinkActive="active"><span>☆</span> Watchlist</a>
      <a routerLink="/portfolio" routerLinkActive="active"><span>▦</span> Portfolio</a>
      <a routerLink="/learn" routerLinkActive="active"><span>◇</span> Learn</a>
      <a routerLink="/history" routerLinkActive="active"><span>↗</span> History</a>
      <a routerLink="/accuracy" routerLinkActive="active"><span>◎</span> Models</a>
    </nav>
    <p class="sidebar-note">Educational analysis only. Not financial advice.</p>
  </aside>
  <div class="workspace">
    <header>
      <span class="status-dot"></span>
      <span>Research systems online</span>
      <a class="notification-link" routerLink="/notifications" aria-label="Open notifications">Alerts @if (alerts.unreadCount()) { <b>{{ alerts.unreadCount() }}</b> }</a>
    </header>
    <router-outlet />
  </div>
</div>
